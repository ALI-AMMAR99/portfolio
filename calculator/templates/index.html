<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الحاسبة الرقمية</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #6a3093 100%);
        padding: 20px;
    }

    .calculator {
        width: 380px;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 25px;
        padding: 25px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4),
                    inset 0 1px 0 rgba(255, 255, 255, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .display {
        background: rgba(0, 0, 0, 0.35);
        border-radius: 15px;
        padding: 20px;
        margin-bottom: 20px;
        min-height: 100px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        word-wrap: break-word;
        overflow-wrap: break-word;
        direction: ltr;
    }

    .expression {
        color: rgba(255, 255, 255, 0.6);
        font-size: 16px;
        text-align: right;
        min-height: 20px;
    }

    .result {
        color: #fff;
        font-size: 34px;
        font-weight: 600;
        text-align: right;
        text-shadow: 0 0 15px rgba(100, 200, 255, 0.5);
        transition: all 0.3s;
    }

    .result.animate {
        transform: scale(1.08);
        color: #64ffda;
    }

    .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
    }

    button {
        padding: 18px 0;
        border: none;
        border-radius: 12px;
        font-size: 19px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s ease;
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    button:hover {
        background: rgba(255, 255, 255, 0.22);
        transform: translateY(-2px);
    }

    button:active {
        transform: translateY(0) scale(0.96);
    }

    .operator {
        background: rgba(255, 159, 64, 0.25);
        color: #ffb74d;
        border-color: rgba(255, 159, 64, 0.3);
    }

    .operator:hover { background: rgba(255, 159, 64, 0.4); }

    .function {
        background: rgba(100, 181, 246, 0.2);
        color: #64b5f6;
        font-size: 16px;
        border-color: rgba(100, 181, 246, 0.3);
    }

    .function:hover { background: rgba(100, 181, 246, 0.35); }

    .equal {
        background: linear-gradient(135deg, #667eea, #764ba2);
        grid-column: span 2;
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }

    .equal:hover {
        box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
    }

    .clear {
        background: rgba(244, 67, 54, 0.3);
        color: #ff7961;
        border-color: rgba(244, 67, 54, 0.4);
    }

    .clear:hover { background: rgba(244, 67, 54, 0.5); }

    .status {
        text-align: center;
        margin-top: 15px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.5);
    }

    @media (max-width: 420px) {
        .calculator { width: 100%; padding: 18px; }
        button { padding: 15px 0; font-size: 17px; }
        .result { font-size: 28px; }
    }
</style>
</head>
<body>

<div class="calculator">
    <div class="display">
        <div class="expression" id="expression"></div>
        <div class="result" id="result">0</div>
    </div>

    <div class="buttons">
        <button class="clear" onclick="clearAll()">AC</button>
        <button class="function" onclick="append('(')">(</button>
        <button class="function" onclick="append(')')">)</button>
        <button class="operator" onclick="append('÷')">÷</button>

        <button class="function" onclick="append('sqrt(')">√</button>
        <button onclick="append('7')">7</button>
        <button onclick="append('8')">8</button>
        <button onclick="append('9')">9</button>

        <button class="function" onclick="append('^')">x^y</button>
        <button onclick="append('4')">4</button>
        <button onclick="append('5')">5</button>
        <button onclick="append('6')">6</button>

        <button class="function" onclick="append('pi')">π</button>
        <button onclick="append('1')">1</button>
        <button onclick="append('2')">2</button>
        <button onclick="append('3')">3</button>

        <button class="function" onclick="append('sin(')">sin</button>
        <button onclick="append('0')">0</button>
        <button onclick="append('.')">.</button>
        <button class="operator" onclick="append('×')">×</button>

        <button class="function" onclick="append('cos(')">cos</button>
        <button class="function" onclick="append('tan(')">tan</button>
        <button class="function" onclick="append('log(')">log</button>
        <button class="operator" onclick="append('-')">−</button>

        <button class="function" onclick="backspace()">⌫</button>
        <button class="function" onclick="append('factorial(')">n!</button>
        <button class="operator" onclick="append('+')">+</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>

    <div class="status">Python Backend ✓ | Flask</div>
</div>

<script>
    let currentExpression = '';
    const expressionEl = document.getElementById('expression');
    const resultEl = document.getElementById('result');

    function updateDisplay() {
        expressionEl.textContent = currentExpression || '';
    }

    function append(value) {
        currentExpression += value;
        updateDisplay();
    }

    function clearAll() {
        currentExpression = '';
        updateDisplay();
        resultEl.textContent = '0';
        resultEl.classList.remove('animate');
    }

    function backspace() {
        currentExpression = currentExpression.slice(0, -1);
        updateDisplay();
    }

    async function calculate() {
        if (!currentExpression) return;

        try {
            const response = await fetch('/calculate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ expression: currentExpression })
            });

            const data = await response.json();
            resultEl.textContent = data.result;
            resultEl.classList.add('animate');
            setTimeout(() => resultEl.classList.remove('animate'), 300);
        } catch (error) {
            resultEl.textContent = 'خطأ في الاتصال';
        }
    }

    // دعم لوحة المفاتيح
    document.addEventListener('keydown', (e) => {
        if (/[0-9.]/.test(e.key)) append(e.key);
        else if (e.key === '+') append('+');
        else if (e.key === '-') append('-');
        else if (e.key === '*') append('×');
        else if (e.key === '/') { e.preventDefault(); append('÷'); }
        else if (e.key === '(' || e.key === ')') append(e.key);
        else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); calculate(); }
        else if (e.key === 'Backspace') backspace();
        else if (e.key === 'Escape') clearAll();
    });
</script>

</body>
</html>
